<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdSelect - Sign Up</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{min-height:100vh;background:#111;color:white;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
  body::before{content:"";position:absolute;width:500px;height:500px;background:#FFD500;border-radius:50%;filter:blur(130px);opacity:.22;top:-120px;left:-120px}
  body::after{content:"";position:absolute;width:400px;height:400px;background:#FFD500;border-radius:50%;filter:blur(130px);opacity:.18;bottom:-120px;right:-120px}
  .stage{width:100%;max-width:420px;text-align:center;position:relative;z-index:2}
  .logo{width:70px;height:70px;background:#FFD500;color:#000;font-size:32px;font-weight:900;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 0 25px rgba(255,213,0,.5)}
  h1{font-size:32px;color:#FFD500;letter-spacing:1px} h1 span{color:white;font-size:18px;display:block;margin-top:4px;letter-spacing:3px}
  .subtitle{color:#bbb;font-size:14px;margin:10px 0 20px}
  .form-box{background:#1a1a1a;border:2px solid #FFD500;border-radius:20px;padding:22px;text-align:left;box-shadow:0 0 30px rgba(255,213,0,.3)}
  .form-box h2{color:#FFD500;text-align:center;font-size:22px}
  .form-box p{color:#aaa;text-align:center;font-size:13px;margin:5px 0 15px}
  .input-wrap{position:relative}
  input{width:100%;padding:13px 15px;margin-bottom:11px;border:2px solid #333;border-radius:12px;outline:none;font-size:15px;background:#111;color:white}
  input:focus{border-color:#FFD500} input.error{border-color:red}
  .eye-btn{position:absolute;right:10px;top:12px;background:none;border:none;color:#FFD500;cursor:pointer;font-size:16px}
  #strength{font-size:12px;margin:-6px 0 10px;text-align:left;height:14px}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:#FFD500;color:#000;font-size:16px;font-weight:800;cursor:pointer}
  button:hover{background:#ffe135} button:disabled{opacity:.6;cursor:not-allowed}
  .login{margin-top:12px;font-size:14px;text-align:center;color:#aaa}
  .login a{color:#FFD500;font-weight:700;text-decoration:none}
  #success{display:none;text-align:center;padding:10px}
  #success h3{color:#FFD500;font-size:22px}
  #success p{color:#ddd;margin:8px 0}
  .confetti{position:fixed;top:-10px;font-size:22px;animation:fall 3s linear forwards;z-index:99;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
  #hint{font-size:13px;color:#FFD500;margin-top:12px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="stage">
  <div class="logo">A</div>
  <h1>ADSELECT <span>SIGN UP</span></h1>
  <p class="subtitle">Create your AdSelect account to start earning</p>

  <div class="form-box" id="formBox">
    <div id="formContent">
      <h2>Create Account ✨</h2>
      <p>Join AdSelect today — it's free!</p>
      <form id="signupForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Password" required>
          <button type="button" class="eye-btn" id="togglePass">👁️</button>
        </div>
        <div id="strength"></div>
        <input type="password" id="confirm" placeholder="Confirm Password" required>
        <button type="submit" id="signupBtn">Sign Up 🚀</button>
      </form>
      <div class="login">Already have an account? <a href="#" id="loginLink">Login</a></div>
    </div>
    <div id="success">
      <h3>🎉 Welcome to AdSelect, <span id="userName"></span>!</h3>
      <p>Your AdSelect account has been created successfully.</p>
      <p style="color:#FFD500">Check your email to verify.</p>
      <button id="againBtn">Create Another Account</button>
    </div>
  </div>
  <div id="hint"></div>
</div>

<script>
  const form = document.getElementById('signupForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm');
  const strengthText = document.getElementById('strength');
  const togglePass = document.getElementById('togglePass');
  const signupBtn = document.getElementById('signupBtn');
  const hint = document.getElementById('hint');

  togglePass.addEventListener('click', () => {
    if (passInput.type === 'password') { passInput.type = 'text'; togglePass.textContent = '🙈'; }
    else { passInput.type = 'password'; togglePass.textContent = '👁️'; }
  });

  passInput.addEventListener('input', () => {
    const val = passInput.value;
    if (val.length === 0) { strengthText.textContent = ''; return; }
    if (val.length < 4) { strengthText.textContent = '❌ Weak password'; strengthText.style.color = 'red'; }
    else if (val.length < 8) { strengthText.textContent = '⚠️ Medium password'; strengthText.style.color = 'orange'; }
    else { strengthText.textContent = '✅ Strong password'; strengthText.style.color = '#FFD500'; }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    [nameInput, emailInput, passInput, confirmInput].forEach(i => i.classList.remove('error'));
    if (nameInput.value.trim().length < 3) { alert('Please enter your full name (at least 3 letters)'); nameInput.classList.add('error'); nameInput.focus(); return; }
    if (!emailInput.value.includes('@') || !emailInput.value.includes('.')) { alert('Please enter a valid email like name@gmail.com'); emailInput.classList.add('error'); emailInput.focus(); return; }
    if (passInput.value !== confirmInput.value) { alert('Passwords do not match!'); confirmInput.classList.add('error'); confirmInput.focus(); return; }
    if (passInput.value.length < 4) { alert('Password is too short! Use at least 4 characters'); return; }

    signupBtn.textContent = 'Creating Account... ⏳';
    signupBtn.disabled = true;
    hint.textContent = 'Please wait...';
    setTimeout(() => {
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.getElementById('userName').textContent = nameInput.value;
      hint.textContent = '✅ AdSelect account created successfully!';
      startConfetti();
    }, 1500);
  });

  function startConfetti() {
    const emojis = ['🎉','💛','✨','🎊','⭐','🖤'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDelay = (Math.random() * 1) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  document.getElementById('loginLink').addEventListener('click', (e) => {
    e.preventDefault();
    alert('AdSelect Login page coming soon! For now, please Sign Up 😊');
  });
  document.getElementById('againBtn').addEventListener('click', () => {
    form.reset();
    strengthText.textContent = '';
    signupBtn.textContent = 'Sign Up 🚀';
    signupBtn.disabled = false;
    hint.textContent = '';
    document.getElementById('formContent').style.display = 'block';
    document.getElementById('success').style.display = 'none';
  });
</script>
</body>
</html>
